<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Расписание Лаборатории</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Onest:wght@500;600;700;800&display=swap">
<style>
/* Layout: one narrow column — «что дальше» сверху, вкладки месяцев, календарь (десктоп) и список (везде) */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --sunk:#efeee9;
  --ink:#1b1c1a; --ink-2:#565853; --ink-3:#8b8d86; --line:#e3e2dc;
  --accent:#d9533a;
  --meet:#d9533a; --meet-bg:#fbe8e3;
  --group:#14966a; --group-bg:#e2f4ec;
  --mat:#b7780a; --mat-bg:#fbf0d9;
  --display:"Onest","Golos Text",-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141513; --surface:#1d1e1c; --sunk:#252623;
  --ink:#f1f1ec; --ink-2:#bfc0b9; --ink-3:#8c8e87; --line:#33342f;
  --accent:#f0806a;
  --meet:#f0806a; --meet-bg:#3b211b;
  --group:#4fcf9b; --group-bg:#173327;
  --mat:#e8b453; --mat-bg:#3a2e15;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141513; --surface:#1d1e1c; --sunk:#252623;
  --ink:#f1f1ec; --ink-2:#bfc0b9; --ink-3:#8c8e87; --line:#33342f;
  --accent:#f0806a;
  --meet:#f0806a; --meet-bg:#3b211b;
  --group:#4fcf9b; --group-bg:#173327;
  --mat:#e8b453; --mat-bg:#3a2e15;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--ink-2);max-width:62ch}

/* next */
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.next .when{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:8px 10px;border-radius:10px;background:var(--sunk);font-variant-numeric:tabular-nums}
.next .when b{font-family:var(--display);font-size:26px;line-height:1;font-weight:800}
.next .when span{font-size:11.5px;color:var(--ink-2);text-transform:lowercase}
.next .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.next .lbl.today{color:var(--accent)}
.next .t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;min-width:0}
.next .t small{display:block;font-family:var(--body);font-weight:400;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.next .more{grid-column:1 / -1;border-top:1px dashed var(--line);margin-top:6px;padding-top:9px;font-size:13.5px;color:var(--ink-2)}
.next .more b{color:var(--ink);font-weight:600}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab{flex:none;font-family:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px 8px;min-width:112px}
.tab .n{display:block;font-family:var(--display);font-weight:700;font-size:15px}
.tab .s{display:block;font-size:11.5px;color:var(--ink-3)}
.tab.past{opacity:.6}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);opacity:1}
.tab[aria-selected="true"] .s{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tab:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* month */
.month{display:flex;flex-direction:column;gap:16px}
.mh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.mh h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:0}
.status{font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.status.now{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.status.draft{border:1px dashed var(--ink-3);background:transparent}
.lead{margin:0;color:var(--ink-2);max-width:68ch}
.banner{background:var(--mat-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.banner b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:center;font-weight:600;padding-bottom:2px}
.cd{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cd.out{background:transparent;border-style:dashed}
.cd.out .dn{opacity:.45}
.cd.we{background:color-mix(in srgb,var(--sunk) 60%,var(--surface))}
.cd.out.we{background:transparent}
.cd.past{opacity:.55}
.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
.cd.today .dn{color:var(--accent);font-weight:700}
.dn{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;line-height:1.25;padding:4px 6px;border-radius:5px;border-left:3px solid;word-break:break-word}
.chip .tm{display:block;font-size:10.5px;opacity:.8;font-variant-numeric:tabular-nums}
.k-meet{background:var(--meet-bg);border-color:var(--meet)}
.k-group{background:var(--group-bg);border-color:var(--group)}
.k-mat{background:var(--mat-bg);border-color:var(--mat)}
.chip.cont{opacity:.7;font-style:italic}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.list h3{font-family:var(--display);font-size:16px;font-weight:700;margin:6px 0 2px}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.ev .d{font-variant-numeric:tabular-nums;line-height:1.15}
.ev .d b{display:block;font-family:var(--display);font-weight:800;font-size:19px}
.ev .d span{font-size:12px;color:var(--ink-3)}
.ev .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .h i{width:9px;height:9px;border-radius:50%;flex:none}
.ev .ti{font-weight:600;font-size:15px}
.ev .tm{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.ev.past{opacity:.5}
.ev.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tbd{display:flex;flex-wrap:wrap;gap:6px}
.tbd span{font-size:13.5px;padding:6px 11px;border-radius:8px;border:1px dashed var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.tbd span i{width:8px;height:8px;border-radius:50%}
.ahead{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ahead div{background:var(--sunk);border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--ink-2)}
.ahead b{display:block;color:var(--ink);font-family:var(--display);font-size:14.5px;margin-bottom:2px}
.foot{border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.lnk{color:var(--accent);text-decoration:none;font-weight:600}
.lnk:hover{text-decoration:underline}
.cal-only{display:block}
@media (max-width:700px){.cal-only{display:none}.next .t{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.tab{transition:background .15s,color .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Лаборатория</p>
    <h1>Расписание</h1>
    <p class="sub">Всё, что происходит в Лаборатории, по месяцам. Время — по Алматы. Ссылка на подключение — в анонсе встречи в комьюнити.</p>
  </header>

  <section class="next" id="next" aria-live="polite"></section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Месяцы"></nav>

  <section class="month" id="month"></section>

  <footer class="foot">
    <span>Вебинары записываются, воркшопы проходят без записи.</span>
    <span><a class="lnk" target="_top" href="https://www.vitaliybuzhan.com/products/communities/v2/buzhan-lab/vstrechi">Встречи в комьюнити</a> · <a class="lnk" target="_top" href="https://www.vitaliybuzhan.com/library">Записи вебинаров</a></span>
  </footer>
</div>

<script>
/* ===== ДАННЫЕ РАСПИСАНИЯ — правится только этот блок =====
   kind: meet — встречи, group — практика и мини-группы, mat — материалы, курс, опросы
   date: "ГГГГ-ММ-ДД", end — для событий на несколько дней, time — время по Алматы */
const MONTHS = [
  { key:"2026-09", name:"Сентябрь", state:"done",
    lead:"Первый месяц экспериментов. Запускаем гипотезу, сформулированную на воркшопе 29 августа, и проходим первый круг до контрольной точки.",
    events:[
      {date:"2026-09-01", kind:"group", title:"Старт эксперимента сентября", text:"Берём в работу гипотезу с августовского воркшопа."},
      {date:"2026-09-07", end:"2026-09-21", kind:"group", title:"Челлендж месяца", text:"Протокол из «Равновесия» — делаем вместе и сверяем результат."},
      {date:"2026-09-18", kind:"meet", title:"Вебинар «Пределы продуктивности»", text:"Продуктивность как диапазон: где верхняя и нижняя граница и чем платим за выход за них."},
      {date:"2026-09-19", kind:"mat", title:"Пульс-опрос", text:"Три вопроса о месяце."},
      {date:"2026-09-22", kind:"mat", title:"Ответ на пульс", text:"Что услышали и что меняем."},
      {date:"2026-09-26", kind:"meet", title:"Контрольная точка", text:"Подводим сентябрьский эксперимент."},
      {date:"2026-09-29", kind:"meet", title:"Вебинар вопросов и ответов", text:"Ваши вопросы по методу, эксперименту и курсам."}
    ]},
  { key:"2026-10", name:"Октябрь", state:"live",
    lead:"Октябрь спокойнее обычного. 26 октября стартует курс «Правила продуктивности», и весь ноябрь пройдёт в плотном темпе курса. Поэтому сейчас меньше событий: запускаем эксперимент и мини-группы, а силы бережём на ноябрь.",
    banner:"<b>Весь октябрь, до 30.10:</b> персональный разбор профиля self.guide для участников — $100 вместо $150.",
    events:[
      {date:"2026-10-04", kind:"meet", title:"Воркшоп по целям", text:"Старт эксперимента месяца: ставим гипотезу на октябрь."},
      {date:"2026-10-04", kind:"mat", title:"Конспект воркшопа, PDF", text:"PDF с заданиями — для тех, кто пропустил или хочет пройти ещё раз."},
      {date:"2026-10-05", end:"2026-10-09", kind:"group", title:"Заявки в мини-группы", text:"Участие по желанию. Оставьте заявку — мы соберём составы."},
      {date:"2026-10-10", kind:"group", title:"Сверка недели", text:"Короткая сверка по гипотезе и эксперименту."},
      {date:"2026-10-12", kind:"group", title:"Запуск мини-групп", text:"Группы начинают работу, у каждой свой чат."},
      {date:"2026-10-16", time:"16:00–18:00", kind:"meet", title:"Групповой разбор профиля self.guide", text:"Разбираем профиль на всю группу — каждый узнаёт себя в чужом случае."},
      {date:"2026-10-17", kind:"group", title:"Сверка недели", text:"Короткая сверка по гипотезе и эксперименту."},
      {date:"2026-10-20", time:"15:00–17:00", kind:"meet", title:"Вебинар вопросов и ответов", text:"Ваши вопросы по методу, эксперименту и курсам."},
      {date:"2026-10-24", time:"15:00–17:00", kind:"meet", title:"Контрольная точка", text:"Подводим октябрьский эксперимент: что получилось, что мешало, что дальше."},
      {date:"2026-10-26", kind:"mat", title:"Старт курса «Правила продуктивности»", text:"Для участников Лаборатории — с первого дня: чат, вебинары, материалы."},
      {date:"2026-10-29", kind:"mat", title:"Пульс-опрос", text:"Три вопроса о месяце. Ответ — 1 ноября."}
    ]},
  { key:"2026-11", name:"Ноябрь", state:"draft",
    lead:"Весь ноябрь идёт курс «Правила продуктивности» — темп месяца задаёт курс. Даты остальных событий появятся здесь, как только будут утверждены.",
    events:[
      {date:"2026-11-01", kind:"mat", title:"Ответ на пульс", text:"Что услышали в октябрьском опросе и что меняем."}
    ],
    tbd:[
      {kind:"mat", title:"Курс «Правила продуктивности» — весь месяц"},
      {kind:"meet", title:"Воркшоп по целям"},
      {kind:"meet", title:"Дополнительный воркшоп по целям для пропустивших"},
      {kind:"meet", title:"Групповой разбор профиля self.guide"},
      {kind:"meet", title:"Вебинар вопросов и ответов"},
      {kind:"meet", title:"Контрольная точка"},
      {kind:"mat", title:"Пульс-опрос"}
    ]},
  { key:"2026-12", name:"Декабрь", state:"draft",
    lead:"Месяц подведения итогов года и подготовки к новому циклу.",
    events:[
      {date:"2026-12-26", kind:"meet", title:"Воркшоп по целям", text:"Итоги года и цели на следующий."}
    ],
    tbd:[
      {kind:"meet", title:"Групповой разбор профиля self.guide"},
      {kind:"meet", title:"Вебинар вопросов и ответов"},
      {kind:"meet", title:"Контрольная точка"},
      {kind:"mat", title:"Пульс-опрос"}
    ],
    ahead:[
      {t:"Новая платформа", d:"Материалы, разделы и расписание — каждое на своём месте."},
      {t:"Январь", d:"Большой воркшоп — планирование года."}
    ]}
];
/* ===== конец данных ===== */

const KIND = {meet:"встречи", group:"практика и мини-группы", mat:"материалы, курс, опросы"};
const MON_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MON_SH = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const STATE = {done:"прошёл", live:"идёт сейчас", draft:"набросок"};
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function todayAlmaty(){
  try{
    return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Almaty",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  }catch(e){ const d=new Date(); return d.toISOString().slice(0,10); }
}
const TODAY = todayAlmaty();
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const ALL = MONTHS.flatMap(m => m.events);
const last = e => e.end || e.date;
const isPast = e => last(e) < TODAY;
const isToday = e => e.date <= TODAY && last(e) >= TODAY;
function dayLabel(s){ const d=parse(s); return `${d.getDate()} ${MON_GEN[d.getMonth()]}, ${WD[d.getDay()]}`; }
function rangeLabel(e){
  if(!e.end) return "";
  const a=parse(e.date), b=parse(e.end);
  return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON_GEN[b.getMonth()]}` : `${a.getDate()} ${MON_SH[a.getMonth()]} – ${b.getDate()} ${MON_SH[b.getMonth()]}`;
}

function renderNext(){
  const live = ALL.filter(isToday);
  const up = ALL.filter(e => e.date > TODAY).sort((a,b)=>a.date.localeCompare(b.date));
  const tomorrow = addDays(TODAY,1);
  let h = "";
  const lead = live.length ? live[0] : up[0];
  if(!lead){ el("next").innerHTML = `<div class="t">Новых событий пока нет<small>Расписание следующего месяца появится здесь.</small></div>`; return; }
  const d = parse(lead.date <= TODAY ? TODAY : lead.date);
  const label = live.length ? "сегодня" : (lead.date===tomorrow ? "завтра" : "следующее");
  h += `<div class="when"><b>${d.getDate()}</b><span>${MON_SH[d.getMonth()]}, ${WD[d.getDay()]}</span></div>`;
  h += `<div class="lbl${live.length?" today":""}">${label}</div>`;
  const rest = (live.length ? live.slice(1) : up.filter(e=>e.date===lead.date).slice(1));
  h += `<div class="t">${esc(lead.title)}${rest.length?` <span style="font-weight:500;color:var(--ink-2)">и ещё ${rest.length}</span>`:""}<small>${lead.time?esc(lead.time)+" · ":""}${esc(lead.text||"")}</small></div>`;
  const after = up.filter(e => e.date > (live.length ? TODAY : lead.date))[0];
  if(after) h += `<div class="more">Потом: <b>${esc(dayLabel(after.date))}</b> — ${esc(after.title)}${after.time?", "+esc(after.time):""}</div>`;
  el("next").innerHTML = h;
}

let sel = (MONTHS.find(m => m.key===TODAY.slice(0,7)) || MONTHS.find(m=>m.key>TODAY.slice(0,7)) || MONTHS[MONTHS.length-1]).key;
try{ const h = location.hash.replace("#",""); if(MONTHS.some(m=>"m"+m.key===h)) sel = h.slice(1); }catch(e){}

function renderTabs(){
  el("tabs").innerHTML = MONTHS.map(m => {
    const past = m.key < TODAY.slice(0,7);
    const s = m.key===TODAY.slice(0,7) ? "сейчас" : STATE[m.state];
    return `<button class="tab${past?" past":""}" role="tab" id="tab-${m.key}" aria-selected="${m.key===sel}" data-k="${m.key}"><span class="n">${m.name}</span><span class="s">${s}</span></button>`;
  }).join("");
}

function chip(e, day){
  const cont = e.end && day !== e.date;
  const t = cont ? "продолжается" : "";
  return `<div class="chip k-${e.kind}${cont?" cont":""}" title="${esc(e.title)}">${esc(e.title)}${e.time&&!cont?`<span class="tm">${esc(e.time)}</span>`:""}${e.end&&!cont?`<span class="tm">до ${parse(e.end).getDate()} ${MON_SH[parse(e.end).getMonth()]}</span>`:""}</div>`;
}

function renderCal(m){
  const [y,mo] = m.key.split("-").map(Number);
  const first = new Date(y,mo-1,1);
  const off = (first.getDay()+6)%7;
  const nd = new Date(y,mo,0).getDate();
  const weeks = Math.ceil((off+nd)/7);
  const start = new Date(y,mo-1,1-off);
  let h = ["пн","вт","ср","чт","пт","сб","вс"].map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<weeks*7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const s = iso(d), inM = s.slice(0,7)===m.key, wd = d.getDay();
    const evs = ALL.filter(e => e.date===s || (e.end && e.date<s && e.end>=s && (wd===1 || s.slice(8)==="01")));
    const cls = ["cd", inM?"":"out", (wd===0||wd===6)?"we":"", s<TODAY?"past":"", s===TODAY?"today":""].filter(Boolean).join(" ");
    const lbl = d.getDate()===1 ? `1 ${MON_SH[d.getMonth()]}` : d.getDate();
    h += `<div class="${cls}"><span class="dn">${lbl}</span>${evs.map(e=>chip(e,s)).join("")}</div>`;
  }
  return `<div class="cal-only"><div class="cal" role="grid" aria-label="Календарь: ${m.name}">${h}</div></div>`;
}

function renderList(m){
  const evs = [...m.events].sort((a,b)=>a.date.localeCompare(b.date));
  if(!evs.length) return "";
  return `<div class="list"><h3>${m.state==="draft"?"Уже известно":"Коротко о каждом"}</h3>` + evs.map(e => {
    const d = parse(e.date);
    const cls = ["ev", isPast(e)?"past":"", isToday(e)?"today":""].filter(Boolean).join(" ");
    const r = rangeLabel(e);
    return `<div class="${cls}">
      <div class="d"><b>${d.getDate()}</b><span>${MON_SH[d.getMonth()]}, ${WD[d.getDay()]}</span></div>
      <div><div class="h"><i style="background:var(--${e.kind})" aria-hidden="true"></i><span class="ti">${esc(e.title)}</span>${isToday(e)?'<span class="badge">сегодня</span>':""}</div>
      ${(e.time||r)?`<div class="tm">${esc(r||"")}${r&&e.time?" · ":""}${esc(e.time||"")}</div>`:""}
      ${e.text?`<p>${esc(e.text)}</p>`:""}</div>
    </div>`;
  }).join("") + `</div>`;
}

function renderMonth(){
  const m = MONTHS.find(x=>x.key===sel);
  const isNow = m.key===TODAY.slice(0,7);
  let h = `<div class="mh"><h2>${m.name} ${m.key.slice(0,4)}</h2><span class="status${isNow?" now":(m.state==="draft"?" draft":"")}">${isNow?"идёт сейчас":STATE[m.state]}</span></div>`;
  if(m.lead) h += `<p class="lead">${esc(m.lead)}</p>`;
  if(m.banner) h += `<div class="banner">${m.banner}</div>`;
  h += `<div class="legend">${Object.entries(KIND).map(([k,v])=>`<span><i style="background:var(--${k})"></i>${v}</span>`).join("")}</div>`;
  if(m.events.length && m.state!=="draft") h += renderCal(m);
  h += renderList(m);
  if(m.tbd && m.tbd.length) h += `<div class="list"><h3>Даты уточняются</h3><div class="tbd">${m.tbd.map(t=>`<span><i style="background:var(--${t.kind})" aria-hidden="true"></i>${esc(t.title)}</span>`).join("")}</div></div>`;
  if(m.ahead && m.ahead.length) h += `<div class="list"><h3>Что дальше</h3><div class="ahead">${m.ahead.map(a=>`<div><b>${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}</div></div>`;
  el("month").innerHTML = h;
  el("month").setAttribute("aria-labelledby","tab-"+m.key);
}

el("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if(!b) return;
  sel = b.dataset.k;
  try{ history.replaceState(null,"","#m"+sel); }catch(err){}
  renderTabs(); renderMonth();
});
el("tabs").addEventListener("keydown", e => {
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const i = MONTHS.findIndex(m=>m.key===sel);
  const j = Math.max(0, Math.min(MONTHS.length-1, i + (e.key==="ArrowRight"?1:-1)));
  sel = MONTHS[j].key; renderTabs(); renderMonth(); el("tab-"+sel).focus();
});

renderNext(); renderTabs(); renderMonth();
</script>
</body>
</html>

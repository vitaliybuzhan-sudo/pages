  <div class="s51">
    <p class="s129"><span class="s130"></span>Отзывы</p>
    <h2 class="s187">Что говорят читатели и участники</h2>
    <div class="s188"><div class="s189"><p class="s190">10 000+</p><p class="s191">экземпляров книги продано</p></div><div class="s189"><p class="s190">4,8</p><p class="s191">на Литрес</p></div><div class="s192"><p class="s190">5,0</p><p class="s191">в Читай-городе</p></div></div>
    <div class="s193" data-revgrid=""><figure class="s194"><p class="s195" aria-hidden="true">“</p><blockquote class="s196">Классная интеллектуальная подача, Виталий бережно относится к участникам, уделяет время всем вопросам, искренне отвечает на действительно сложные вопросы, не увиливая.</blockquote><figcaption class="s124">Тренинг «Равновесие»</figcaption></figure><figure class="s197"><p class="s195" aria-hidden="true">“</p><blockquote class="s123">Отличная книга для тех, кто хочет «сдвинуться с места и начать действовать». Использую некоторые практики и рекомендации, помогающие мне не утонуть и не разгонять тревогу.</blockquote><figcaption class="s124"><a class="s198" href="https://www.litres.ru/book/vitaliy-buzhan/pravila-produktivnosti-dlya-nevrotika-instrukciya-po-vyzhiv-73861462/" target="_blank" rel="noopener">Литрес · отзыв о книге</a></figcaption></figure><figure class="s197"><p class="s195" aria-hidden="true">“</p><blockquote class="s123">Эта книга поставила жирную точку в моих долгих поисках… Честно скажу, нужно время, чтобы привыкнуть к новому образу жизни, новому мышлению. У меня были «откаты». Но дорогу осилит идущий. Эта книга теперь моя настольная.</blockquote><figcaption class="s124"><a class="s198" href="https://www.chitai-gorod.ru/product/pravila-produktivnosti-dla-nevrotika-instrukcia-po-vyzivaniu-v-sovremennom-mire-dla-trevoznyh-prokrastinatorov-i-teh-kto-prosto-ustal-i-zaputalsa-3154268" target="_blank" rel="noopener">Читай-город · отзыв о книге</a></figcaption></figure><figure class="s197"><p class="s195" aria-hidden="true">“</p><blockquote class="s123">Я проходила тренинг автора, который он упоминает в книге. За год некоторые правила уже стали частью меня.</blockquote><figcaption class="s124"><a class="s198" href="https://www.litres.ru/book/vitaliy-buzhan/pravila-produktivnosti-dlya-nevrotika-instrukciya-po-vyzhiv-73861462/reviews/" target="_blank" rel="noopener">Литрес · отзыв о книге</a></figcaption></figure></div>
  </div></section>
